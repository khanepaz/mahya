<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دنیای جادویی محیا | Mahya's Magical World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="logo">✨ دنیای جادویی <span class="logo-accent">محیا</span></div>
    <div class="header-actions">
      <div class="stars-badge" id="starsBadge">⭐ <span id="starsCount">0</span></div>
      <div class="avatar-btn" id="avatarBtn" onclick="showPage('avatar')" title="آواتار">🐰</div>
    </div>
  </div>
  <div class="page active" id="page-home">
    <div class="hero-banner">
      <div class="hero-text">
        <h1 id="greet">سلام محیا! 💖</h1>
        <p class="hero-sub">به دنیای جادویی خودت خوش اومدی</p>
        <p class="hero-desc">اینجا می‌تونی نقاشی بکشی، بازی کنی، یاد بگیری و کلی چیزای قشنگ کشف کنی!</p>
      </div>
      <div class="hero-emoji" aria-hidden="true">🦄🏰🌈</div>
    </div>
    <div class="main-cats" id="mainCats">
      <button type="button" class="cat-card cat-art" onclick="showPage('art')">
        <span class="cat-icon">🎨</span>
        <span class="cat-title">استودیوی نقاشی</span>
        <span class="cat-desc">رنگ‌ها، خیال‌پردازی، خلاقیت!</span>
        <span class="cat-arrow">←</span>
      </button>
      <button type="button" class="cat-card cat-learn" onclick="showPage('school')">
        <span class="cat-icon">📚</span>
        <span class="cat-title">یادگیری تعاملی</span>
        <span class="cat-desc">از کتاب تا سؤال، با کمک هوش مصنوعی</span>
        <span class="cat-arrow">←</span>
      </button>
      <button type="button" class="cat-card cat-games" onclick="showPage('games')">
        <span class="cat-icon">🎮</span>
        <span class="cat-title">بازی‌های آموزشی</span>
        <span class="cat-desc">معما، حدس کلمه، الگوهای عددی...</span>
        <span class="cat-arrow">←</span>
      </button>
      <button type="button" class="cat-card cat-ai" onclick="showPage('homework')">
        <span class="cat-icon">🤖</span>
        <span class="cat-title">دستیار هوشمند</span>
        <span class="cat-desc">پرسش بپرس، کشف کن، یاد بگیر</span>
        <span class="cat-arrow">←</span>
      </button>
    </div>
    <div class="panel suggest-panel" id="todaySuggest">
      <strong>💡 پیشنهاد امروز:</strong>
      <span id="suggestText">نقاشی یک خانه روی ابرها</span>
      <button class="btn btn-sm" onclick="doSuggest()">شروع کن</button>
    </div>
    <div class="section-label">همه بخش‌ها</div>
    <div class="grid" id="sectionsGrid"></div>
    <div class="footer-motto">💖 هر روز یک قدم به سمت رویاهایت!</div>
  </div>
